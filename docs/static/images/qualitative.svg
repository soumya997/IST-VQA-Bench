<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 450" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Times New Roman', Times, serif, 'Noto Sans Bengali', 'Noto Sans Devanagari'; text-rendering: geometricPrecision;">
    <defs>
        <style>
            .header { font-weight: bold; font-size: 16px; fill: #000000; }
            .cell { font-weight: normal; font-size: 15px; fill: #000000; }
            .bold { font-weight: bold; }
            .italic { font-style: italic; }
        </style>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- Academic Booktabs Format Lines (Black & White) -->
    <line x1="15" y1="15" x2="1335" y2="15" stroke="#000000" stroke-width="2.5" />
    <line x1="15" y1="50" x2="1335" y2="50" stroke="#000000" stroke-width="1.5" />
    <line x1="15" y1="435" x2="1335" y2="435" stroke="#000000" stroke-width="2.5" />

    <!-- Header Row -->
    <text class="header" x="20" y="37">Model</text>
    <text class="header" x="130" y="37">Image Context</text>
    <text class="header" x="310" y="37">User Query (Translation)</text>
    <text class="header" x="530" y="37">Zero-Shot Baseline</text>
    <text class="header" x="710" y="37">Best Fine-Tuned Checkpoint</text>
    <!-- Reduced Spacing Here -->
    <text class="header" x="980" y="37">Diagnostic Takeaway</text>

    <!-- Row 1 -->
    <text class="cell" x="20" y="75">Qwen2.5-VL</text>
    <text class="cell" x="130" y="75">
        <tspan x="130" dy="0">Bengali Comic Book</tspan>
        <tspan x="130" dy="20">Cover</tspan>
    </text>
    <text class="cell" x="310" y="75">কমিকটির নাম কী?</text>
    <text class="cell" x="530" y="75">
        <tspan x="530" dy="0">পুরুষদের কাছে</tspan>
        <tspan class="italic" x="530" dy="20">(Gibberish)</tspan>
    </text>
    <text class="cell" x="710" y="75">
        <tspan x="710" dy="0">বঁটুল দি গ্রেট।</tspan>
        <tspan class="italic" x="710" dy="20">(Correct)</tspan>
    </text>
    <text class="cell" x="980" y="75">
        <tspan x="980" dy="0"><tspan class="bold">Case A:</tspan> LoRA successfully resolves</tspan>
        <tspan x="980" dy="20">severe LLM script hallucination.</tspan>
    </text>

    <!-- Row 2 -->
    <text class="cell" x="20" y="145">Qwen2.5-VL</text>
    <text class="cell" x="130" y="145">
        <tspan x="130" dy="0">Hindi Railway Sign</tspan>
    </text>
    <text class="cell" x="310" y="145">
        <tspan x="310" dy="0">तस्वीर में दिख रहे बोर्ड पर</tspan>
        <tspan x="310" dy="20">हिंदी में क्या लिखा है?</tspan>
    </text>
    <text class="cell italic" x="530" y="145">unanswerable</text>
    <text class="cell" x="710" y="145">
        <tspan x="710" dy="0">तस्वीर में दिख रहे बोर्ड पर हिंदी में</tspan>
        <tspan x="710" dy="20">"आनन्द विहार टर्मिनल" लिखा हुआ है।</tspan>
        <tspan class="italic" x="710" dy="20">(Correct)</tspan>
    </text>
    <text class="cell" x="980" y="145">
        <tspan x="980" dy="0"><tspan class="bold">Case A:</tspan> LLM fine-tuning enables</tspan>
        <tspan x="980" dy="20">zero-shot scene-text recognition</tspan>
        <tspan x="980" dy="20">in native script.</tspan>
    </text>

    <!-- Row 3 -->
    <text class="cell" x="20" y="245">PaliGemma2</text>
    <text class="cell" x="130" y="245">
        <tspan x="130" dy="0">Bengali Comic Book</tspan>
        <tspan x="130" dy="20">Cover</tspan>
    </text>
    <text class="cell" x="310" y="245">
        <tspan x="310" dy="0">ছবিতে শিল্পীর নাম কী</tspan>
        <tspan x="310" dy="20">লেখা আছে?</tspan>
    </text>
    <text class="cell" x="530" y="245">
        <tspan x="530" dy="0">রবীন্দ্রনাথ ঠাকুর।</tspan>
        <tspan class="italic" x="530" dy="20">(Hallucination)</tspan>
    </text>
    <text class="cell" x="710" y="245">
        <tspan x="710" dy="0">নারায়ণ দেবনাথ।</tspan>
        <tspan class="italic" x="710" dy="20">(Correct)</tspan>
    </text>
    <text class="cell" x="980" y="245">
        <tspan x="980" dy="0"><tspan class="bold">Case A:</tspan> Fine-tuning replaces</tspan>
        <tspan x="980" dy="20">semantic guessing with visual</tspan>
        <tspan x="980" dy="20">text grounding.</tspan>
    </text>

    <!-- Row 4 -->
    <text class="cell" x="20" y="345">PaliGemma2</text>
    <text class="cell" x="130" y="345">
        <tspan x="130" dy="0">Hindi Railway Sign</tspan>
    </text>
    <text class="cell" x="310" y="345">
        <tspan x="310" dy="0">तस्वीर में यह हिंदी टेक्स्ट</tspan>
        <tspan x="310" dy="20">कहाँ स्थित है?</tspan>
    </text>
    <text class="cell italic" x="530" y="345">unanswerable</text>
    <text class="cell" x="710" y="345">
        <tspan x="710" dy="0">हिंदी टेक्स्ट नीले रंग के आयताकार</tspan>
        <tspan x="710" dy="20">बोर्ड पर...</tspan>
        <tspan class="italic" x="710" dy="20">(Correct)</tspan>
    </text>
    <text class="cell" x="980" y="345">
        <tspan x="980" dy="0"><tspan class="bold">Case B:</tspan> Connector unfreezing</tspan>
        <tspan x="980" dy="20">resolves spatial text</tspan>
        <tspan x="980" dy="20">localization failures.</tspan>
    </text>
</svg>