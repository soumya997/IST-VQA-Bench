<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1350 450" style="background-color:#fff;font-family:'Times New Roman',Times,serif,'Noto Sans Bengali','Noto Sans Devanagari';text-rendering:geometricPrecision"><defs><style>.cell,.header{fill:#000}.header{font-weight:700;font-size:16px}.cell{font-weight:400;font-size:15px}.bold{font-weight:700}.italic{font-style:italic}</style></defs><rect width="100%" height="100%" fill="#fff"/><line x1="15" x2="1335" y1="15" y2="15" stroke="#000" stroke-width="2.5"/><line x1="15" x2="1335" y1="50" y2="50" stroke="#000" stroke-width="1.5"/><line x1="15" x2="1335" y1="435" y2="435" stroke="#000" stroke-width="2.5"/><text x="20" y="37" class="header">Model</text><text x="130" y="37" class="header">Image Context</text><text x="310" y="37" class="header">User Query (Translation)</text><text x="530" y="37" class="header">Zero-Shot Baseline</text><text x="710" y="37" class="header">Best Fine-Tuned Checkpoint</text><text x="980" y="37" class="header">Diagnostic Takeaway</text><text x="20" y="75" class="cell">Qwen2.5-VL</text><text x="130" y="75" class="cell"><tspan x="130" dy="0">Bengali Comic Book</tspan> <tspan x="130" dy="20">Cover</tspan></text><text x="310" y="75" class="cell">কমিকটির নাম কী?</text><text x="530" y="75" class="cell"><tspan x="530" dy="0">পুরুষদের কাছে</tspan> <tspan x="530" class="italic" dy="20">(Gibberish)</tspan></text><text x="710" y="75" class="cell"><tspan x="710" dy="0">বঁটুল দি গ্রেট।</tspan> <tspan x="710" class="italic" dy="20">(Correct)</tspan></text><text x="980" y="75" class="cell"><tspan x="980" dy="0"><tspan class="bold">Case A:</tspan> LoRA successfully resolves</tspan> <tspan x="980" dy="20">severe LLM script hallucination.</tspan></text><text x="20" y="145" class="cell">Qwen2.5-VL</text><text x="130" y="145" class="cell"><tspan x="130" dy="0">Hindi Railway Sign</tspan></text><text x="310" y="145" class="cell"><tspan x="310" dy="0">तस्वीर में दिख रहे बोर्ड पर</tspan> <tspan x="310" dy="20">हिंदी में क्या लिखा है?</tspan></text><text x="530" y="145" class="cell italic">unanswerable</text><text x="710" y="145" class="cell"><tspan x="710" dy="0">तस्वीर में दिख रहे बोर्ड पर हिंदी में</tspan> <tspan x="710" dy="20">&quot;आनन्द विहार टर्मिनल&quot; लिखा हुआ है।</tspan> <tspan x="710" class="italic" dy="20">(Correct)</tspan></text><text x="980" y="145" class="cell"><tspan x="980" dy="0"><tspan class="bold">Case A:</tspan> LLM fine-tuning enables</tspan> <tspan x="980" dy="20">zero-shot scene-text recognition</tspan> <tspan x="980" dy="20">in native script.</tspan></text><text x="20" y="245" class="cell">PaliGemma2</text><text x="130" y="245" class="cell"><tspan x="130" dy="0">Bengali Comic Book</tspan> <tspan x="130" dy="20">Cover</tspan></text><text x="310" y="245" class="cell"><tspan x="310" dy="0">ছবিতে শিল্পীর নাম কী</tspan> <tspan x="310" dy="20">লেখা আছে?</tspan></text><text x="530" y="245" class="cell"><tspan x="530" dy="0">রবীন্দ্রনাথ ঠাকুর।</tspan> <tspan x="530" class="italic" dy="20">(Hallucination)</tspan></text><text x="710" y="245" class="cell"><tspan x="710" dy="0">নারায়ণ দেবনাথ।</tspan> <tspan x="710" class="italic" dy="20">(Correct)</tspan></text><text x="980" y="245" class="cell"><tspan x="980" dy="0"><tspan class="bold">Case A:</tspan> Fine-tuning replaces</tspan> <tspan x="980" dy="20">semantic guessing with visual</tspan> <tspan x="980" dy="20">text grounding.</tspan></text><text x="20" y="345" class="cell">PaliGemma2</text><text x="130" y="345" class="cell"><tspan x="130" dy="0">Hindi Railway Sign</tspan></text><text x="310" y="345" class="cell"><tspan x="310" dy="0">तस्वीर में यह हिंदी टेक्स्ट</tspan> <tspan x="310" dy="20">कहाँ स्थित है?</tspan></text><text x="530" y="345" class="cell italic">unanswerable</text><text x="710" y="345" class="cell"><tspan x="710" dy="0">हिंदी टेक्स्ट नीले रंग के आयताकार</tspan> <tspan x="710" dy="20">बोर्ड पर...</tspan> <tspan x="710" class="italic" dy="20">(Correct)</tspan></text><text x="980" y="345" class="cell"><tspan x="980" dy="0"><tspan class="bold">Case B:</tspan> Connector unfreezing</tspan> <tspan x="980" dy="20">resolves spatial text</tspan> <tspan x="980" dy="20">localization failures.</tspan></text></svg>